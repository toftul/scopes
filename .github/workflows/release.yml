name: Release

# Push a tag to cut a release:  git tag v0.1.0 && git push origin v0.1.0
# Or run manually from the Actions tab to just get a build artifact.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (e.g. 0.2.0) — builds an artifact, no release"
        required: true

permissions:
  contents: write # needed to create the release

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build universal .app
        run: ./scripts/release.sh "${{ inputs.version || github.ref_name }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vectorscope-app
          path: build/*.zip

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ZIP=$(ls build/*.zip)
          {
            echo "### Install"
            echo
            echo '1. Download `'"$(basename "$ZIP")"'` below and unzip it.'
            echo '2. Move **Vectorscope.app** to `/Applications`.'
            echo '3. The app is signed but **not notarised** (no paid Apple Developer account), so'
            echo '   macOS quarantines it. Clear that once:'
            echo
            echo '   ```bash'
            echo '   xattr -dr com.apple.quarantine /Applications/Vectorscope.app'
            echo '   ```'
            echo
            echo '   Or: open it, then System Settings ▸ Privacy & Security ▸ **Open Anyway**.'
            echo '4. First launch asks for **Screen Recording** permission — grant it and relaunch.'
            echo
            echo 'Universal binary (Apple Silicon + Intel), requires macOS 14 or later.'
            echo
            echo '`shasum -a 256`:'
            echo
            echo '```'
            shasum -a 256 "$ZIP" | sed "s| build/| |"
            echo '```'
          } > notes.md
          gh release create "${{ github.ref_name }}" "$ZIP" \
            --title "${{ github.ref_name }}" \
            --notes-file notes.md \
            --generate-notes
